; =============================================================================
; Ceph inventory — Lucid Computing
;
; Two profiles below. Uncomment the one you need.
; =============================================================================

; -----------------------------------------------------------------------------
; PROFILE A — single-node pilot (hgxa100, as built 27 Jul 2026)
; -----------------------------------------------------------------------------
[ceph]
hgxa100 ansible_host=10.20.10.30

[ceph_bootstrap]
hgxa100

[ceph:vars]
ceph_mon_ip=10.20.10.30
ceph_public_network=10.20.10.0/24
ceph_cluster_network=
ceph_single_host=true

; Model string of the DATA drives only. Selecting by /dev path is unsafe —
; NVMe enumeration shifted between reboots on this exact host.
; The 1.92 TB OS drives are model MZ1L21T9HCLS and must never match this.
ceph_data_device_model=MZQL23T8HCLS
ceph_osds_per_host=8
ceph_total_osds=8

; Single host: failure domain must be osd, or PGs never go active.
ceph_ec_failure_domain=osd
ceph_ec_k=4
ceph_ec_m=2
ceph_ec_profile=ec42

ceph_fs_name=testfs
ceph_rbd_pool=rbd_pool
ceph_mds_count=1
ceph_deploy_rgw=true
ceph_rgw_name=testrgw
ceph_rgw_count=1
ceph_rgw_port=8000
ceph_deploy_monitoring=true
ceph_mclock_profile=balanced


; -----------------------------------------------------------------------------
; PROFILE B — production, 7 nodes
;
; Seven, not six. With 6 hosts and EC 4+2 every PG spans all six, so losing
; two leaves zero margin and losing three takes down 100% of PGs. At 7 hosts
; CRUSH picks 6 of 7 per PG, restoring uneven distribution and allowing
; maintenance without consuming the entire failure budget.
; See ceph-pilot-report.md.
; -----------------------------------------------------------------------------
; [ceph]
; ceph-01 ansible_host=10.30.10.11
; ceph-02 ansible_host=10.30.10.12
; ceph-03 ansible_host=10.30.10.13
; ceph-04 ansible_host=10.30.10.14
; ceph-05 ansible_host=10.30.10.15
; ceph-06 ansible_host=10.30.10.16
; ceph-07 ansible_host=10.30.10.17
;
; [ceph_bootstrap]
; ceph-01
;
; [ceph:vars]
; ceph_mon_ip=10.30.10.11
; ceph_public_network=10.30.10.0/24
; ceph_cluster_network=10.31.10.0/24
; ceph_single_host=false
;
; ceph_data_device_model=CHANGE_ME
; ceph_osds_per_host=5
; ceph_total_osds=35
;
; ceph_ec_failure_domain=host
; ceph_ec_k=4
; ceph_ec_m=2
; ceph_ec_profile=ec42
;
; ceph_fs_name=lucidfs
; ceph_rbd_pool=rbd_vms
; ceph_mds_count=2
; ceph_deploy_rgw=true
; ceph_rgw_name=s3
; ceph_rgw_count=2
; ceph_rgw_port=8000
; ceph_deploy_monitoring=true
; ceph_mclock_profile=balanced
;
; Production notes:
;   * Set a DHCP reservation (or static address) for every MON. MON addresses
;     are written into the monmap; a changed lease means surgery.
;   * cephadm places 5 MONs automatically across 7 hosts. Leave it alone.
;   * ceph_mclock_profile governs the ~6h redundancy-restoration window after
;     a node loss. high_recovery_ops shortens it at the cost of tenant I/O.
