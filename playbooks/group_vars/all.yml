ssl_cert_path: '/etc/ssl/certs'
ssl_ca_cert: '{{ ssl_cert_path }}/cluster-ca.crt'
ssl_cert_group: ssl

# Datacenter driver branch from the Ubuntu archive. The -server branches track
# NVIDIA's datacenter drivers and have matching nvidia-fabricmanager-<major>
# packages. The fabric manager major version must exactly match the driver, so
# both nvidia roles consume this variable and hold the packages together.
nvidia_driver_branch: "570-server"
nvidia_driver_package: "nvidia-driver-{{ nvidia_driver_branch }}"

# Node hardware profiles. Each compute host selects one via the node_profile
# inventory variable; profiles drive the slurmd Gres/Feature line, gres.conf,
# GPU-role gating (drivers, fabric manager, exporters), and limits.
#
# gres_entries[].cores is the CPU affinity per GPU group (Slurm gres.conf
# Cores=). Derive real values from `nvidia-smi topo -m` on the node; wrong
# values only degrade affinity, they don't block scheduling.
node_profiles:
  a100-hgx8:
    gpu: true
    gpu_type: A100
    gpu_count: 8
    fabric_manager: true
    features: [a100, gpu]
    gres_entries:
      # Verified on hgxa100 via nvidia-smi topo -m (2026-08-07): GPUs 0-3 on
      # NUMA 0 (cores 0-63), GPUs 4-7 on NUMA 1 (cores 64-127)
      - { files: "/dev/nvidia[0-3]", cores: "0-63" }
      - { files: "/dev/nvidia[4-7]", cores: "64-127" }
    # Reserve 8 cores + 64G from jobs for the co-located Ceph daemons
    # (slurm.conf sets TaskPluginParam=SlurmdOffSpec); remove when Ceph moves
    # to dedicated storage nodes.
    slurmd_extra: "CoreSpecCount=8 MemSpecLimit=65536"
  h100nvl-1:
    gpu: true
    gpu_type: H100NVL
    gpu_count: 1
    fabric_manager: false
    features: [h100nvl, gpu]
    gres_entries:
      # Verified on lucid via nvidia-smi topo -m (2026-08-07): NUMA 0, cores 0-15
      - { files: "/dev/nvidia0", cores: "0-15" }
    slurmd_extra: ""
  cpu:
    gpu: false
    gpu_type: ""
    gpu_count: 0
    fabric_manager: false
    features: [cpu]
    gres_entries: []
    slurmd_extra: ""

# Profile of the host currently being configured (compute nodes set
# node_profile in the inventory; controller/login default to cpu).
this_node_profile: "{{ node_profiles[node_profile | default('cpu')] }}"

# --- security -----------------------------------------------------------
# Hardening for internet-exposed hosts (controller/login). The per-host toggles
# (ssh_hardening, firewall_mode, fail2ban, unattended_upgrades,
# user_slice_limits) live in the inventory — see samples/inventory.example.
# Values below mirror what was hand-applied to sv5 on 2026-08-10
# (~/Projects/greenfield/public-ip/session-log.md).

# Sources allowed through ufw unrestricted, and exempt from fail2ban bans:
# the colo LAN (NFS/LDAP/slurm/ceph/metrics) and the FortiClient VPN pool.
firewall_trusted_subnets:
  - 10.20.10.0/24
  - 10.212.134.0/24

# sshd AllowGroups on hardened hosts. Groups are created by privilege_group
# (cluster-admins gid 9878, cluster-users gid 9879); membership is per-user
# (onboarding adds users to cluster-users; admins are added by hand).
sshd_allow_groups:
  - cluster-admins
  - cluster-users

# Per-user systemd slice caps on hardened interactive hosts.
user_slice_cpu_quota: '200%'
user_slice_memory_high: '3G'
user_slice_memory_max: '4G'
user_slice_tasks_max: 256
