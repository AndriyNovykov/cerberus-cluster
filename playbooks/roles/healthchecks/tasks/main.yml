- name: Create healthchecks directory
  become: true
  file:
    name: '/opt/lucid-hpc/healthchecks'
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'

- name: Copy healthcheck scripts
  become: true
  copy:
    src: '{{ item }}'
    dest: '/opt/lucid-hpc/healthchecks/{{ item }}'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
  with_items:
    - check_gpu_setup.py
    - gpu_bw_test.py
    - xid_checker.py
    - shared_logging.py

- name: Write node profile for check_gpu_setup.py
  become: true
  copy:
    content: "{{ {'gpu_count': this_node_profile.gpu_count | default(0),
                  'gpu_type': this_node_profile.gpu_type | default('')} | to_nice_json }}\n"
    dest: /opt/lucid-hpc/healthchecks/node_profile.json
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0644'
