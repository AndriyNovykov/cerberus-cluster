---
# apt-key was removed in Ubuntu 25.04+; use a signed-by keyring instead
- name: Ensure apt keyrings directory exists
  become: true
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Grafana GPG key
  become: true
  get_url:
    url: https://packages.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: '0644'

- name: Add Grafana repository
  become: true
  apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/grafana.asc] https://packages.grafana.com/oss/deb stable main'
    state: present
    filename: 'grafana'

- name: Update apt cache
  become: true
  apt:
    update_cache: yes

- name: Install Grafana package
  become: true
  apt:
    name: grafana
    state: present

- name: Start and enable Grafana service
  become: true
  service:
    name: grafana-server
    state: started
    enabled: yes

- name: Ensure Grafana key directory exists
  file:
    path: "/etc/opt/lucid-hpc/passwords/grafana"
    state: directory
  delegate_to: localhost

# /api/auth/keys was removed in Grafana 11; this is only an is-it-up probe
- name: Wait for Grafana to answer
  uri:
    url: "{{ grafana_api_url }}/api/health"
    method: GET
    return_content: true
  register: result
  until: result is not failed
  retries: 5
  delay: 5

# Grafana ships with admin/admin; apply the inventory admin_password if the
# API rejects it (fresh install, or the inventory value changed)
- name: Check whether the admin password is current
  uri:
    url: "{{ grafana_api_url }}/api/org"
    user: "{{ grafana_security.admin_user }}"
    password: "{{ grafana_security.admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: grafana_admin_check
  no_log: true

- name: Apply the Grafana admin password
  become: true
  # The deb's server unit gets its data path from /etc/default/grafana-server,
  # not the ini — without the override the CLI writes a fresh DB under
  # /usr/share/grafana/data and the reset never reaches the real one.
  command: >-
    grafana-cli --homepath /usr/share/grafana --config /etc/grafana/grafana.ini
    --configOverrides cfg:default.paths.data=/var/lib/grafana
    admin reset-admin-password {{ grafana_security.admin_password | quote }}
  when: grafana_admin_check.status == 401
  no_log: true

- name: Create Prometheus datasource in Grafana
  grafana_datasource:
    name: "Prometheus"
    grafana_url: "{{ grafana_api_url }}"
    grafana_user: "{{ grafana_security.admin_user }}"
    grafana_password: "{{ grafana_security.admin_password }}"
    ds_type: "prometheus"
    ds_url: "http://localhost:9090"
  ignore_errors: yes
