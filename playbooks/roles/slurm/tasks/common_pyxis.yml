---
- name: set /etc/enroot as enroot path if no nvme drive
  set_fact: 
    enroot_top_path_checked: "/etc/enroot/"
  when: " not 'nvme0n1' in hostvars[inventory_hostname].ansible_devices"

- name: set {{enroot_top_path}} as enroot path if nvme drive
  set_fact: 
    enroot_top_path_checked: "{{enroot_top_path}}"
  when: "'nvme0n1' in hostvars[inventory_hostname].ansible_devices" 
  
- name: Ensure prolog directory exists
  become: true
  file:
    path: "{{ slurm_conf_path }}/prolog.d"
    state: directory
    owner: root
    group: root

- name: copy files
  become: true
  become_method: sudo
  template:
    src: pyxis.sh.j2
    dest: "{{ slurm_conf_path }}/prolog.d/pyxis.sh"
    owner: root
    group: root
    mode: 0755
    force: yes
    backup: yes  

- name: install required packages
  vars: 
    package_name: 
      - gcc-c++
      - git
  include_role: 
    name: safe_yum
  when: ansible_os_family == 'RedHat'

- name: install required packages
  vars: 
    package_name: 
      - gcc
      - git
      - make
  include_role: 
    name: safe_yum
  when: ansible_os_family == 'Debian'

# Pinned: plugstack.conf marks the plugin 'required', so a silently missing
# .so makes slurmd/srun fail hard — the build must succeed loudly, on a known
# version (v0.24.0 verified against Slurm 24.05 on this cluster).
- name: clone pyxis repo
  git:
    repo: https://github.com/NVIDIA/pyxis.git
    dest: /tmp/pyxis
    version: "{{ pyxis_version | default('v0.24.0') }}"

# Build only — the Makefile's install target pipes echo into `install
# /dev/stdin`, which fails under Ansible's no-stdin execution. We install the
# plugin ourselves (the pyxis.conf that target writes is unused; we manage
# plugstack.conf below).
- name: compile
  command: make
  args:
    chdir: /tmp/pyxis/
  when: not ansible_check_mode

- name: Ensure the slurm plugin directory exists
  become: true
  file:
    path: /usr/local/lib/slurm
    state: directory
    mode: '0755'

- name: Install the pyxis plugin
  become: true
  copy:
    src: /tmp/pyxis/spank_pyxis.so
    dest: /usr/local/lib/slurm/spank_pyxis.so
    remote_src: true
    mode: '0644'
  when: not ansible_check_mode

- name: Assert the pyxis plugin exists before declaring it required
  stat:
    path: /usr/local/lib/slurm/spank_pyxis.so
  register: pyxis_so
  failed_when: not pyxis_so.stat.exists
  when: not ansible_check_mode

- name: create plugstack.conf
  become: true
  copy:
    dest: "{{ slurm_conf_path }}/plugstack.conf"
    content: |
      required /usr/local/lib/slurm/spank_pyxis.so
    mode: '0775'
    owner: root
    group: "{{privilege_group_name}}"