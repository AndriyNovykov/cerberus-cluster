---
- name: Edit /etc/security/access.conf
  become: true
  blockinfile:
    dest: /etc/security/access.conf
    block: |
      +:root:ALL
      +:wheel:ALL
      +:opc:ALL
      -:ALL:ALL
  when: ansible_os_family == 'RedHat'

# Whitelist the node's actual admin user and the privilege group — admin
# usernames differ across hand-installed machines; a hardcoded name here
# locks out SSH entirely on nodes where it doesn't exist.
- name: Edit /etc/security/access.conf
  become: true
  blockinfile:
    dest: /etc/security/access.conf
    block: |
      +:root:ALL
      +:wheel:ALL
      +:{{ ansible_user }}:ALL
      +:({{ privilege_group_name }}):ALL
      -:ALL:ALL
  when: ansible_distribution == 'Ubuntu'

- name: Copy sshd file
  become: true
  copy:
    src: sshd
    dest: /etc/pam.d/sshd
  when: ansible_os_family == 'RedHat'

- name: Check that pam_slurm_adopt is installed
  stat:
    path: /usr/local/lib/security/pam_slurm_adopt.so
  register: pam_adopt_so

# A 'required' PAM module whose .so is missing denies ALL logins — only wire
# it into sshd when the module actually exists.
- name: Add required pam account permission
  become: true
  lineinfile:
    path: /etc/pam.d/sshd
    line: "account    required      /usr/local/lib/security/pam_slurm_adopt.so"
    state: "{{ 'present' if pam_adopt_so.stat.exists else 'absent' }}"
    backup: yes
    insertafter: EOF
  when: ansible_distribution == 'Ubuntu'

# SchedMD pattern: admins whitelisted in access.conf short-circuit past
# pam_slurm_adopt (sufficient success ends the account stack); LDAP users
# fail the -:ALL:ALL check non-fatally and fall through to pam_slurm_adopt,
# which admits them only if they hold a running job on this node. Without
# this, pam_slurm_adopt (action_no_jobs=deny, root-only exemption) denies
# the admin user on every login, including pubkey.
- name: Add sufficient pam_access before pam_slurm_adopt in sshd
  become: true
  lineinfile:
    path: /etc/pam.d/sshd
    line: "account    sufficient    pam_access.so"
    state: "{{ 'present' if pam_adopt_so.stat.exists else 'absent' }}"
    insertbefore: 'pam_slurm_adopt\.so'
    backup: yes
  when: ansible_distribution == 'Ubuntu'

- name: Comment pam_systemd.so in /etc/pam.d/common-session
  become: true
  lineinfile:
    path: /etc/pam.d/common-session
    regexp: 'pam_systemd.so$'
    line: "#session        optional        pam_systemd.so"
    state: present
    backup: yes
  when: ansible_distribution == 'Ubuntu'

- name: Comment pam_systemd.so in /etc/pam.d/runuser-l
  become: true
  lineinfile:
    path: /etc/pam.d/runuser-l
    regexp: 'pam_systemd.so$'
    line: "#-session       optional        pam_systemd.so"
    state: present
    backup: yes
  when: ansible_distribution == 'Ubuntu'

- name: Comment pam_systemd.so in /etc/pam.d/systemd-user in 20.04
  become: true
  lineinfile:
    path: /etc/pam.d/systemd-user
    regexp: 'pam_systemd.so$'
    line: "#session optional pam_systemd.so"
    state: present
    backup: yes
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_version == '20.04'

- name: Comment pam_access.so in /etc/pam.d/common-auth
  become: true
  lineinfile:
    path: /etc/pam.d/common-auth
    regexp: 'pam_access.so$'
    line: "#account required    pam_access.so"
    state: present
    backup: yes
  when: ansible_distribution == 'Ubuntu'

- name: Stop logind
  become: true
  systemd:
    name: systemd-logind
    state: stopped
    enabled: no
    masked: yes
