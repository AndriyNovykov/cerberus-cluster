---
- name: Run Pam settings
  include_tasks: compute_pam.yml
  when: pam|bool

- name: install SLURM compute packages
  vars: 
    package_name: '{{ slurm_compute_packages }}'
    package_repo: "{{ slurm_repos }}"
    disable_gpg_check_var: True
  include_role: 
    name: safe_yum

- name: Render systemd units for slurmd
  become: true
  template:
    src: 'systemd/{{ item }}.service.j2'
    dest: '/lib/systemd/system/{{ item }}.service'
    backup: "yes"
  with_items:
    - slurmd
  when: ansible_os_family == 'Debian'

- name: Create systemd unit dirs
  become: true
  file:
    name: '/etc/systemd/system/{{ item }}.service.d'
    state: directory
  with_items:
    - munge
    - slurmd

- name: Render systemd units for slurmd and munge
  become: true
  template:
    src: 'systemd/{{ item }}.service.d/unit.conf.j2'
    dest: '/etc/systemd/system/{{ item }}.service.d/unit.conf'
    backup: "yes"
  with_items:
    - munge
    - slurmd

- name: Create munge dir
  become: true
  file:
    name: '{{ munge_conf_path }}'
    state: directory
    owner: munge
    group: munge
    mode: 0700

- name: copy munge.key to tmp
  become: true
  shell:
    cmd: cp /etc/munge/munge.key /tmp/munge.key
  delegate_to: 127.0.0.1
  run_once: true

- name: set permissions
  become: true
  shell:
    cmd: chown {{ controller_username }}:{{ controller_username }} /tmp/munge.key
  delegate_to: 127.0.0.1
  run_once: true

- name: Copy munge key
  become: true
  copy:
    src: /tmp/munge.key
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: '0400'
  notify: restart munge
  when: not ansible_check_mode

- name: restart munge
  become: true
  service:
    name: munge
    state: restarted
    enabled: true

- name: Add to the gres.conf file on the controller.
  become: true
  blockinfile:
    block: "{{ lookup('template', 'gres.conf.j2') }}"
    path: "{{ slurm_conf_path }}/gres.conf"
    marker: "### {mark} {{ansible_hostname}}"
  throttle: 1
  delegate_to: 127.0.0.1
  when: this_node_profile.gpu | default(false)

# slurmctld serves configless nodes the gres.conf it read at startup; without
# this reconfigure a node's FIRST registration reports 0 GPUs and gets
# drained with INVALID_REG
- name: Reconfigure Slurm so the controller serves the updated gres.conf
  become: true
  command: "scontrol reconfigure"
  delegate_to: 127.0.0.1
  run_once: true
  when: this_node_profile.gpu | default(false)

- name: Run Pam settings
  include_tasks: compute_pam.yml
  when: pam|bool

- name: start slurmd
  become: true
  service:
    name: slurmd
    state: restarted
    enabled: true
    
- name: Reconfigure Slurm
  become: true
  command: "scontrol reconfigure"
  delegate_to: 127.0.0.1
  run_once: true