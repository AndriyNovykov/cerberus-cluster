---

- name: Install ufw
  vars:
    package_name:
      - ufw
    package_state: present
  include_role:
    name: safe_yum

- name: ufw default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: ufw default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: ufw allow SSH from anywhere
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: public SSH

- name: ufw allow trusted subnets
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    comment: trusted subnet
  loop: "{{ firewall_trusted_subnets }}"

- name: ufw enable
  community.general.ufw:
    state: enabled
