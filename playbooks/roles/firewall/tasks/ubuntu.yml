---

# firewall_mode=off  (default): no host firewall — compute nodes need open
#                    traffic or MPI fails.
# firewall_mode=ufw: default-deny hardening for exposed hosts (controller/login):
#                    allow SSH from anywhere plus everything from the trusted
#                    subnets (colo LAN, VPN pool). Do NOT run off-iptables.sh in
#                    this mode — it flushes the rules ufw just installed.

- include_tasks: ubuntu-off.yml
  when: firewall_mode | default('off') == 'off'

- include_tasks: ubuntu-ufw.yml
  when: firewall_mode | default('off') == 'ufw'
