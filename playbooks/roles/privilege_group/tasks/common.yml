- name: create groupname group (gid 9876)
  become: true
  group:
    name: "{{privilege_group_name}}"
    gid: 9876
    state: present
    
- name: allow groupname group to have passwordless sudo
  become: true
  lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: '^%{{privilege_group_name}}'
    line: '%{{privilege_group_name}} ALL=(ALL) NOPASSWD: ALL'
    validate: 'visudo -cf %s'
  when: privilege_sudo | bool

- name: "add opc/ubuntu user to {{privilege_group_name}} group"
  become: true
  user:
    name: "{{ansible_user}}"
    groups: "{{privilege_group_name}}"
    append: yes

# SSH access-control groups consumed by sshd AllowGroups (roles/ssh, gated by
# ssh_hardening). Fixed gids keep them identical across nodes; LDAP users can be
# members of these local groups via NSS.
- name: create cluster-admins group
  become: true
  group:
    name: cluster-admins
    gid: 9878
    state: present

- name: create cluster-users group
  become: true
  group:
    name: cluster-users
    gid: 9879
    state: present

- name: "add {{ ansible_user }} to cluster-users so Ansible keeps SSH access on hardened hosts"
  become: true
  user:
    name: "{{ ansible_user }}"
    groups: cluster-users
    append: yes
