---

- name: install sssd
  vars: 
    package_name: 
      - sssd
    package_state: present
  include_role: 
    name: safe_yum

- name: Add configuration file to /etc/sssd/sssd.conf
  template:
    src: 'sssd.conf.j2'
    dest: '/etc/sssd/sssd.conf'
    owner: 'root'
    group: 'root'
    mode: '0600'
  notify: restart sssd
  when: not pam | bool

- name: Add configuration file to /etc/sssd/sssd.conf
  template:
    src: 'sssd_ubuntu.conf.j2'
    dest: '/etc/sssd/sssd.conf'
    owner: 'root'
    group: 'root'
    mode: '0600'
  notify: restart sssd
  when: pam | bool

- name: Copy CA certificate
  copy:
    src: "{{ ssl_ca_cert }}"
    dest: /etc/ssl/certs/cluster-ca.crt

- name: Adjust OpenLDAP client TLS configuration
  lineinfile:
    path: '/etc/ldap/ldap.conf'
    line: 'TLS_CACERT   /etc/ssl/certs/cluster-ca.crt'

# With pam=True the slurm role owns this line: compute_pam.yml comments it
# out and puts 'account sufficient pam_access.so' in sshd instead. Re-adding
# it here would duplicate/churn the line on every run.
- name: Fix common-auth
  lineinfile:
    dest: /etc/pam.d/common-auth
    state: present
    line: 'account required    pam_access.so'
  when: not (pam | default(false) | bool)

- name: Fix common-session
  lineinfile:
    dest: /etc/pam.d/common-session
    state: present
    line: 'session required    pam_mkhomedir.so skel=/etc/skel umask=0022'

# pam-auth-update already chains unix -> sss -> ldap from the profiles that
# libpam-sss/libpam-ldapd register, so common-password needs no edits here.
# The old 'replace' on '^.*use_authtok.*$' rewrote the pam_unix and pam_sss
# lines into duplicate pam_ldap ones, breaking local password changes; the
# tasks below only repair hosts it already mangled.
- name: Check common-password still has pam_unix
  command: grep -q '^password.*pam_unix\.so' /etc/pam.d/common-password
  register: pam_unix_present
  changed_when: false
  failed_when: false

- name: Regenerate PAM stacks mangled by the old use_authtok replace
  command: pam-auth-update --package --force
  when: pam_unix_present.rc != 0

- name: Install the openldap and required Packages for Ubuntu
  vars: 
    package_name: "{{ openldap_packages }}"
    package_state: present
    package_cache: true
  include_role: 
    name: safe_yum

- name: Enable sssd service
  systemd:
    name: sssd
    enabled: "yes"

- name: Start sssd service
  systemd:
    name: sssd
    state: started

- name: Update sshd configuration
  lineinfile: 
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: PasswordAuthentication no
  notify: 
    - restart sshd
    - restart ns daemons
    - restart login services
