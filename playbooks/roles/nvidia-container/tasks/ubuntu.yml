---

- name: add key
  apt_key:
    url: "{{ libnvidia_container_repo_gpg_url }}"
    state: present

# NVIDIA's repo is distro-agnostic now: one deb path serves all releases
- name: add repo
  apt_repository:
    repo: "deb {{ libnvidia_container_repo_base_url }}/stable/deb/amd64 /"
    filename: nvidia-container-toolkit
    state: present

- name: Install nvidia-container-toolkit
  vars:
    package_name:
      - nvidia-container-toolkit
    package_state: latest
    package_cache: true
  include_role:
    name: safe_yum

- name: Configure the container runtime for Docker
  become: true
  command: nvidia-ctk runtime configure --runtime=docker

- name: Start Docker
  ansible.builtin.service:
    name: "docker"
    state: restarted
