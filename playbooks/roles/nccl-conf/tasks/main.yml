---
# tasks file for nccl-conf
#
# The shipped nccl.conf files are tuned for specific RDMA fabrics; select one
# per node profile once an inter-node fabric exists. With no RDMA fabric
# (cluster_network=false) this role is never invoked from site.yml.
- name: copy nccl.conf for H100
  become: true
  copy:
    src: h100
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: '0644'
  when: this_node_profile.gpu_type | default('') == 'H100'

- name: copy nccl.conf for A100
  become: true
  copy:
    src: a100_b4.8
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: '0644'
  when: this_node_profile.gpu_type | default('') == 'A100'
