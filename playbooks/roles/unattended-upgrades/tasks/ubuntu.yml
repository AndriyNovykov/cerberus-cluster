---

# bin/controller.sh purges unattended-upgrades at bootstrap because it fights
# Ansible apt runs and can restart services mid-deploy. This role re-enables it
# at configure time on hosts that opt in (unattended_upgrades=true), constrained
# to security-only origins with automatic reboots off, and unmasks the timers
# controller.sh masked.

- name: Install unattended-upgrades
  vars:
    package_name:
      - unattended-upgrades
    package_state: present
  include_role:
    name: safe_yum

- name: Enable daily package list update + unattended upgrade
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Constrain to security origins, no automatic reboot
  copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Unmask and enable apt timers
  systemd:
    name: "{{ item }}"
    masked: no
    enabled: yes
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Enable unattended-upgrades service
  systemd:
    name: unattended-upgrades
    enabled: yes
    state: started
