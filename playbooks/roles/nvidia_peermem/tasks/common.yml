---
# nvidia_peermem enables GPUDirect RDMA; only relevant on GPU nodes with an
# RDMA-capable fabric (MLNX_OFED installed). Inert until such a fabric exists.
- name: Check if nvidia drivers are installed
  shell: cat /sys/module/nvidia/version | wc -l
  register: nvidia
  when: this_node_profile.gpu | default(false)

- name: Check if nvidia_peermem module is loaded
  shell: lsmod | grep nvidia_peermem | wc -l
  register: result
  when: this_node_profile.gpu | default(false) and nvidia.stdout == '1'

- name: Check ofed version
  shell:
    cmd: |
      /usr/bin/ofed_info |grep MLNX_OFED_LINUX|grep -v rpm|awk -F "(" '{print $2}'|cut -c 6-|awk -F "-" '{print $1}'
  register: ofed_version_local
  failed_when: false
  when: this_node_profile.gpu | default(false) and nvidia.stdout == '1'

- name: Load nvidia_peermem module
  become: true
  shell: modprobe nvidia_peermem
  when: this_node_profile.gpu | default(false) and nvidia.stdout == '1' and result.stdout != '3' and ofed_version_local.rc | default(1) == 0 and ofed_version_local.stdout | default('0') is version('5.1', '>=')