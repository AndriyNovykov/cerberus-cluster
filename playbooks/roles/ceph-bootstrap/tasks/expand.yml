---
- name: List hosts already known to the orchestrator
  ansible.builtin.command: ceph orch host ls --format json
  register: ceph_known_hosts
  changed_when: false

- name: Add remaining hosts to the cluster
  ansible.builtin.command: >-
    ceph orch host add {{ item }} {{ hostvars[item]['ansible_host'] | default(item) }}
  loop: "{{ groups['ceph'] }}"
  when: item not in (ceph_known_hosts.stdout | from_json | map(attribute='hostname') | list)

- name: Wait for the orchestrator to inventory all hosts
  ansible.builtin.command: ceph orch host ls --format json
  register: ceph_hosts_final
  until: (ceph_hosts_final.stdout | from_json | length) == (groups['ceph'] | length)
  retries: 12
  delay: 10
  changed_when: false

# Read the GLOBAL-scope value specifically: `ceph config get <entity>` returns
# scope overrides (bootstrap writes a mon-scope public_network) which would
# never match and make the set task fire on every run
- name: Read the current public_network setting
  ansible.builtin.shell: |
    set -o pipefail
    ceph config dump --format json | python3 -c '
    import json,sys
    for o in json.load(sys.stdin):
        if o.get("section")=="global" and o.get("name")=="public_network":
            print(o.get("value")); break'
  args:
    executable: /bin/bash
  register: ceph_pubnet_current
  changed_when: false
  failed_when: false
  when: ceph_public_network | default('') | length > 0

- name: Set public_network explicitly
  ansible.builtin.command: ceph config set global public_network {{ ceph_public_network }}
  when:
    - ceph_public_network | default('') | length > 0
    - ceph_pubnet_current.stdout | default('') | trim != ceph_public_network

# Ceph daemons bind anywhere in 6800-7300 by default — a range that contains
# slurmctld/slurmd's 6817/6818. On co-located nodes an OSD can steal slurmd's
# port at boot; start the Ceph range at 7000 to keep them disjoint.
- name: Read ms_bind_port_min
  ansible.builtin.command: ceph config get osd ms_bind_port_min
  register: ceph_bind_min_current
  changed_when: false
  failed_when: false

- name: Keep Ceph daemon ports clear of Slurm (6817/6818)
  ansible.builtin.command: ceph config set global ms_bind_port_min {{ ceph_ms_bind_port_min | default(7000) }}
  when: ceph_bind_min_current.stdout | default('') | trim != (ceph_ms_bind_port_min | default(7000) | string)
