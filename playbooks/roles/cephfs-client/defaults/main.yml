---
ceph_client_name: "{{ ceph_fs_name }}"
ceph_client_secret_dir: /etc/opt/oci-hpc/passwords/ceph
cephfs_mount_path: /clusterhome
# nofail + automount: on the node that HOSTS the Ceph cluster the mount cannot
# succeed until the ceph containers are up, which is long after remote-fs.target
# — a hard mount there fails the target and takes munge/slurmd down with it.
# The automount attaches on first access instead.
cephfs_mount_opts: "name={{ ceph_client_name }},secretfile=/etc/ceph/{{ ceph_client_name }}.secret,fs={{ ceph_fs_name }},_netdev,nofail,x-systemd.automount,x-systemd.mount-timeout=30"
