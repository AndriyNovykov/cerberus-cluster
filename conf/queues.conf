---
# Minimal static queue definition for the on-prem cluster.
# Loaded by site.yml / slurm_config.yml as Ansible vars (the `queues` list
# feeds slurm.conf partition generation). Node hardware is described by
# node_profiles in playbooks/group_vars/all.yml, not here.
  queues:
    - name: cerberus
      default: true
      instance_types:
        - name: cerberus
          default: true
          shape: onprem
          hyperthreading: true
